[project]
name = "projethti"
version = "0.1.0"
description = "Challenge COS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cityscapesscripts>=2.3.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
